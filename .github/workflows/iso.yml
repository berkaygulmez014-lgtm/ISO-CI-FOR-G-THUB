name: iso

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release etiketi (boşsa sadece artifact)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Disk boşalt (runner'da ~14 GB boş kalıyor)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: ISO üret
        run: bash scripts/ci-build.sh

      - name: Özet
        run: |
          echo "### ISO" >> $GITHUB_STEP_SUMMARY
          ls -lh out/*.iso >> $GITHUB_STEP_SUMMARY || true
          du -sh out/*.iso >> $GITHUB_STEP_SUMMARY || true

      - uses: actions/upload-artifact@v4
        with:
          name: parametral-iso
          path: out/*.iso
          retention-days: 14

      - name: Release'e yükle
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Parametral OS ${{ inputs.tag || github.ref_name }}
          body: |
            Parametral OS live ISO.

            - kullanıcı: `parametral` / şifre: `parametral`
            - UEFI + BIOS önyükleme
            - Masaüstü: KDE Plasma 6 + Hyprland/Noctalia (arkadaşın OS reposundaki kimlikle aynı)
            - Giriş: SDDM parametral teması (oturum seçimi: Parametral = Hyprland, Plasma = KDE)
            - Açılış: plymouth parametral splash
            - Parametral oturumu VM'de yazılım GL'e otomatik düşer (parametral-session)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
