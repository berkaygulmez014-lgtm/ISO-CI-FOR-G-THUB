# Parametral lock screen.
#
# Same language as the rest of the system: the wallpaper behind glass, one clock, one field,
# one lockup. Nothing here pretends to be a login manager — the session stays alive, this only
# hides it.
#
# The field's states are the point of this file: a hairline at rest, amber while the password
# is being checked, red with a sentence when it is wrong.

background {
    monitor =
    path = /usr/share/wallpapers/Parametral/contents/images/2560x1440.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.62
    color = rgba(11, 15, 20, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgb(E9E4D8)
    font_family = Noto Sans
    font_size = 76
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    # "20 Kasım Cuma" — full month, capitalised: the bar shows the same string
    text = cmd[update:60000] echo "$(LC_TIME=tr_TR.utf8 date '+%-d %B %A')"
    color = rgb(154, 164, 178)
    font_family = Noto Sans
    font_size = 14
    position = 0, 88
    halign = center
    valign = center
}

label {
    monitor =
    # one lockup instead of two floating words; tracking via Pango markup
    text = <span letter_spacing="4800">PARAMETRAL</span>
    color = rgb(E0A93B)
    font_family = Noto Sans
    font_size = 11
    position = 0, -190
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    rounding = 12

    # at rest the frame is a hairline; amber only appears while it is working
    outer_color = rgba(154, 164, 178, 0.35)
    check_color = rgb(E0A93B)
    fail_color = rgb(D66056)
    capslock_color = rgb(E0A93B)
    numlock_color = rgba(154, 164, 178, 0.35)
    bothlock_color = rgb(E0A93B)

    inner_color = rgb(18, 23, 30)
    font_color = rgb(E9E4D8)
    font_family = Noto Sans
    fade_on_empty = false

    placeholder_text = <span foreground="#6B7280">şifre</span>
    position = 0, -60
    halign = center
    valign = center
}
