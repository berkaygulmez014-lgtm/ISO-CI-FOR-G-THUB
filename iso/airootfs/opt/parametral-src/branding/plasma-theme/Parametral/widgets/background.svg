<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="64" height="64" viewBox="0 0 64 64">
  <!-- Parametral widget/launcher background (v0.1.24).
       Kickoff's popup and Plasma widgets use widgets/background.svg from the theme.
       Opaque graphite surface, amber hairline, one blue corner accent. -->
  <defs>
    <clipPath id="clip-topleft"><rect x="0" y="0" width="18" height="18"/></clipPath>
    <clipPath id="clip-top"><rect x="18" y="0" width="28" height="18"/></clipPath>
    <clipPath id="clip-topright"><rect x="46" y="0" width="18" height="18"/></clipPath>
    <clipPath id="clip-left"><rect x="0" y="18" width="18" height="28"/></clipPath>
    <clipPath id="clip-center"><rect x="18" y="18" width="28" height="28"/></clipPath>
    <clipPath id="clip-right"><rect x="46" y="18" width="18" height="28"/></clipPath>
    <clipPath id="clip-bottomleft"><rect x="0" y="46" width="18" height="18"/></clipPath>
    <clipPath id="clip-bottom"><rect x="18" y="46" width="28" height="18"/></clipPath>
    <clipPath id="clip-bottomright"><rect x="46" y="46" width="18" height="18"/></clipPath>
    <path id="plate" d="M18,3 L46,3 A15,15 0 0 1 61,18 L61,46 A15,15 0 0 1 46,61 L18,61 A15,15 0 0 1 3,46 L3,18 A15,15 0 0 1 18,3 Z" fill="#12171E" fill-opacity="1"/>
    <path id="rim" d="M18,3 L46,3 A15,15 0 0 1 61,18 L61,46 A15,15 0 0 1 46,61 L18,61 A15,15 0 0 1 3,46 L3,18 A15,15 0 0 1 18,3 Z" fill="none" stroke="#E0A93B" stroke-opacity="0.30" stroke-width="1.6"/>
    <path id="rim-blue" d="M46,3 A15,15 0 0 1 61,18" fill="none" stroke="#2FA8E8" stroke-opacity="0.85" stroke-width="2.2"/>
  </defs>
  <rect id="hint-left-margin"   x="0"  y="18" width="18" height="28" fill="none"/>
  <rect id="hint-right-margin"  x="46" y="18" width="18" height="28" fill="none"/>
  <rect id="hint-top-margin"    x="18" y="0"  width="28" height="18" fill="none"/>
  <rect id="hint-bottom-margin" x="18" y="46" width="28" height="18" fill="none"/>
  <rect id="hint-left-inset"    x="0"  y="18" width="4"  height="28" fill="none"/>
  <rect id="hint-right-inset"   x="60" y="18" width="4"  height="28" fill="none"/>
  <rect id="hint-top-inset"     x="18" y="0"  width="28" height="4"  fill="none"/>
  <rect id="hint-bottom-inset"  x="18" y="60" width="28" height="4"  fill="none"/>
  <g id="topleft"><use href="#plate"/><use href="#rim"/></g>
  <g id="top"><use href="#plate"/><use href="#rim"/></g>
  <g id="topright"><use href="#plate"/><use href="#rim"/><use href="#rim-blue"/></g>
  <g id="left"><use href="#plate"/><use href="#rim"/></g>
  <g id="center"><use href="#plate"/></g>
  <g id="right"><use href="#plate"/><use href="#rim"/></g>
  <g id="bottomleft"><use href="#plate"/><use href="#rim"/></g>
  <g id="bottom"><use href="#plate"/><use href="#rim"/></g>
  <g id="bottomright"><use href="#plate"/><use href="#rim"/></g>
</svg>
