<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!--
    Parametral start icon, drawn for 22 px first: a bold dial reads at panel size,
    the detailed tick ring of the full mark does not (the ticks collapse into dots).
  -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#9AA4B2" stroke-width="2.6" opacity="0.55"/>

  <!-- four cardinal ticks, thick enough to survive downscaling -->
  <g stroke="#E9E4D8" stroke-width="3.4" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="4.6"  x2="24" y2="8.6"/>
    <line x1="24" y1="39.4" x2="24" y2="43.4"/>
    <line x1="4.6" y1="24"  x2="8.6" y2="24"/>
    <line x1="39.4" y1="24" x2="43.4" y2="24"/>
  </g>

  <!-- the "live" segment of the dial, in text colour: amber belongs to the screen's one live
       signal (the active workspace tick), never to the mark, or every bar carries two ambers -->
  <path d="M34.6 13.4 A15 15 0 0 1 38.6 21.2" fill="none"
        stroke="#E9E4D8" stroke-width="3.6" stroke-linecap="round"/>

  <!-- needle + hub -->
  <line x1="24" y1="24" x2="30.5" y2="17.5" stroke="#F2EDE4" stroke-width="3"
        stroke-linecap="round"/>
  <circle cx="24" cy="24" r="3.2" fill="#F2EDE4"/>
</svg>
